<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Liquid Drop Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#f4f4f2; --muted:#8a8a88; --dim:#5b5b59; --panel:rgba(22,22,22,.72); --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; height:100dvh; background:var(--bg); overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:Inter, ui-sans-serif, system-ui, sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; -webkit-user-select:none; }
  #crop { position:fixed; left:0; top:0; pointer-events:none; border:1px solid rgba(255,255,255,.55); will-change:transform,opacity; }
  #crop i { position:absolute; width:5px; height:5px; border:1px solid rgba(255,255,255,.75); background:rgba(0,0,0,.25); transform:translate(-50%,-50%); }
  #crop b { position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); }
  #crop b::before, #crop b::after { content:""; position:absolute; background:rgba(255,255,255,.55); }
  #crop b::before { left:0; right:0; top:50%; height:1px; }
  #crop b::after { top:0; bottom:0; left:50%; width:1px; }
  #caption { position:fixed; left:0; right:0; pointer-events:none; text-align:center; height:120px; }
  .slide { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; will-change:transform,filter,opacity; }
  .pg { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:11px; letter-spacing:.06em; color:var(--dim); margin-bottom:12px; }
  .pg em { font-style:normal; color:var(--fg); }
  .title { font-size:clamp(26px, 2.6vw, 40px); font-weight:400; letter-spacing:-.015em; line-height:1.1; }
  .sub { margin-top:10px; font-size:clamp(12px, 1vw, 15px); color:var(--muted); letter-spacing:.005em; }
  #edit { position:fixed; right:18px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:#1b1b1b; border:1px solid var(--line); color:#bdbdbb; display:grid; place-items:center; cursor:pointer; }
  #edit:hover { color:#fff; background:#242424; }
  #panel { position:fixed; right:62px; top:50%; width:236px; transform:translateY(-50%) translateX(12px); opacity:0; pointer-events:none;
           background:var(--panel); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
           transition: opacity .25s ease, transform .35s cubic-bezier(.2,1.2,.3,1); font-size:12px; color:#cfcfcd; }
  #panel.open { opacity:1; pointer-events:auto; transform:translateY(-50%); }
  #panel h4 { font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; font-family:"JetBrains Mono", ui-monospace, monospace; }
  .row { margin-bottom:12px; }
  .row label { display:flex; justify-content:space-between; margin-bottom:6px; }
  .row label span:last-child { font-family:"JetBrains Mono", ui-monospace, monospace; color:var(--muted); font-size:11px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:2px; background:#3a3a3a; border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#f2f2f0; cursor:pointer; box-shadow:0 0 0 3px rgba(255,255,255,.08); }
  .btns { display:flex; gap:6px; margin-top:4px; }
  .btn { flex:1; height:28px; border-radius:8px; border:1px solid var(--line); background:#1d1d1d; color:#e6e6e4; font:inherit; font-size:12px; cursor:pointer; }
  .btn:hover { background:#262626; }
  .btn.on { background:#f2f2f0; color:#111; }
  .tog { display:flex; align-items:center; justify-content:space-between; margin:2px 0 12px; }
  .tog input { accent-color:#f2f2f0; }
  .hint { margin-top:10px; color:var(--dim); font-size:11px; line-height:1.5; }
  canvas#gl { cursor:none; }
  #cursor { position:fixed; left:0; top:0; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:rgba(255,255,255,.92); box-shadow:0 0 0 5px rgba(255,255,255,.1); pointer-events:none; display:none; opacity:1;
            transition: width .15s, height .15s, margin .15s, opacity .12s ease; z-index:10; }
  #cursor.down { width:10px; height:10px; margin:-5px 0 0 -5px; }
  #cursor.hide { opacity:0; width:4px; height:4px; margin:-2px 0 0 -2px; }
  body.remove #cursor { background:transparent; border:1.5px solid rgba(255,255,255,.9); box-shadow:none; }

  #fallback { position:fixed; inset:0; display:grid; place-items:center; padding:32px; text-align:center; color:#cfcfcd; font-size:15px; line-height:1.6; }
  @media (max-width:700px), (pointer:coarse) {
    canvas#gl { cursor:auto; }
    #cursor { display:none !important; }
    #edit { top:auto; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); right:calc(16px + env(safe-area-inset-right, 0px)); transform:none; z-index:5; }
    #panel { top:auto; bottom:calc(56px + env(safe-area-inset-bottom, 0px)); right:16px; left:16px; width:auto; max-width:360px; margin-left:auto; transform:translateY(12px); }
    #panel.open { transform:none; }
    .title { font-size:clamp(22px, 6.2vw, 34px); }
    .sub { font-size:clamp(12px, 3.2vw, 15px); }
    .hint { display:none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="crop"><i style="left:0;top:0"></i><i style="left:33.3%;top:0"></i><i style="left:50%;top:0"></i><i style="left:66.6%;top:0"></i><i style="left:100%;top:0"></i>
<i style="left:0;top:100%"></i><i style="left:33.3%;top:100%"></i><i style="left:50%;top:100%"></i><i style="left:66.6%;top:100%"></i><i style="left:100%;top:100%"></i>
<i style="left:0;top:50%"></i><i style="left:100%;top:50%"></i><i style="left:30%;top:50%"></i><i style="left:70%;top:50%"></i><b></b></div>
<div id="caption"></div>
<button id="edit" title="Properties"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
<div id="panel">
  <h4>Properties</h4>
  <div class="row"><label><span>Goo</span><span id="vGoo"></span></label><input id="goo" type="range" min="0" max="90" step="1" value="42"></div>
  <div class="row"><label><span>Bounce</span><span id="vBounce"></span></label><input id="bounce" type="range" min="0" max="1" step="0.01" value="0.55"></div>
  <div class="row"><label><span>Orbit</span><span id="vOrbit"></span></label><input id="orbit" type="range" min="0" max="4" step="0.05" value="1"></div>
  <div class="row"><label><span>Refraction</span><span id="vRefr"></span></label><input id="refr" type="range" min="0" max="1.5" step="0.01" value="0.8"></div>
  <div class="tog"><span>Crop guides</span><input id="cropOn" type="checkbox" checked></div>
  <div class="btns"><button class="btn" id="add">+ Add drop</button><button class="btn" id="rm">Remove</button></div>
  <div class="hint">Tap a drop to bring it in · scroll or ←/→ · drag the frame edge · tap empty space to add a drop</div>
</div>
<div id="cursor"></div>
<script>
(() => {
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture'), DEMO = Q.has('demo') || CAPTURE;
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias:false, premultipliedAlpha:false, preserveDrawingBuffer: CAPTURE });
if (!gl) {
  const el = document.createElement('div'); el.id = 'fallback';
  el.textContent = 'This gallery needs WebGL2. Try a current version of Safari, Chrome, or Firefox.';
  document.body.appendChild(el);
  return;
}
const MAXN = 16, IMG_W = 1024, IMG_H = 636, IA = IMG_W / IMG_H;

// ---------- data ----------
const SLIDES = [
  { photo:0, title:'Where the light begins', sub:'Scroll \u2014 the next drop flows into the frame.' },
  { photo:3, title:'Soft layers, sharp focus', sub:'Tune goo, bounce and orbit from the properties panel.' },
  { photo:1, title:'Made for stories', sub:'Images or videos \u2014 up to 12 items.' },
  { photo:2, title:'End on a strong frame', sub:'The section releases the scroll after the last drop.' },
  { photo:4, title:'One more drop', sub:'Add, remove and reorder items freely.' },
];
const EXTRA = [
  { title:'Born from the orbit', sub:'A new drop condenses out of the dark.' },
  { title:'Still water, bright edge', sub:'Every merge ends in a little wobble.' },
  { title:'Hold the frame', sub:'Drag its edge \u2014 it pulls like jelly.' },
];

// ---------- params ----------
const P = { goo:42, bounce:0.55, orbit:1, refr:0.8, crop:true, remove:false };
const bindRange = (id, key, fmt) => { const el = document.getElementById(id), v = document.getElementById('v' + id[0].toUpperCase() + id.slice(1));
  const set = () => { P[key] = parseFloat(el.value); v.textContent = fmt(P[key]); }; el.addEventListener('input', set); set(); };
bindRange('goo', 'goo', x => x.toFixed(0) + 'px');
bindRange('bounce', 'bounce', x => x.toFixed(2));
bindRange('orbit', 'orbit', x => x.toFixed(2) + '\u00d7');
bindRange('refr', 'refr', x => x.toFixed(2));
document.getElementById('cropOn').addEventListener('change', e => P.crop = e.target.checked);
const panel = document.getElementById('panel');
document.getElementById('edit').onclick = () => panel.classList.toggle('open');
const rmBtn = document.getElementById('rm');
rmBtn.onclick = () => { P.remove = !P.remove; rmBtn.classList.toggle('on', P.remove); document.body.classList.toggle('remove', P.remove); };

// ---------- springs ----------
const S = v => ({ v, vel:0, t:v });
const zeta = () => Math.max(0.18, 1 - 0.78 * P.bounce);
function stepLog(s, K, z, dt) { const c = 2 * z * Math.sqrt(K); const lv = Math.log(Math.max(s.v, 0.5)); const a = -K * (lv - Math.log(Math.max(s.t, 0.5))) - c * s.vel; s.vel += a * dt; s.v = Math.exp(lv + s.vel * dt); }
function stepS(s, K, z, dt) { const c = 2 * z * Math.sqrt(K); const a = -K * (s.v - s.t) - c * s.vel; s.vel += a * dt; s.v += s.vel * dt; }

// ---------- layout ----------
let W = innerWidth, H = innerHeight, dpr = 1;
const L = {};
function viewSize() {
  const vv = window.visualViewport;
  if (vv && vv.width && vv.height) return [vv.width, vv.height, vv.offsetLeft || 0, vv.offsetTop || 0];
  return [innerWidth, innerHeight, 0, 0];
}
function layout() {
  const [vw, vh, ox, oy] = viewSize();
  W = vw; H = vh; dpr = Math.min(devicePixelRatio || 1, CAPTURE ? 1 : 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.style.left = ox + 'px'; cv.style.top = oy + 'px';
  L.unit = Math.min(W, H * 1.5);
  const satPad = L.unit * 0.045 + 14;
  const capH = Math.min(H * 0.22, 150);
  const padTop = Math.max(12, satPad * 0.35);
  L.cx = W / 2;
  L.hw = Math.min(W * 0.265, H * 0.255 * 1.6);
  L.hh = L.hw / 1.6;
  L.rx = Math.max(L.hw + 110, W * 0.372);
  L.ry = L.hh + Math.min(H * 0.09, 86);
  const maxRx = Math.max(24, W / 2 - satPad);
  if (L.rx > maxRx) {
    const s = maxRx / L.rx;
    L.rx = maxRx;
    L.hw *= Math.min(1, s * 1.08);
    L.hh = L.hw / 1.6;
  }
  const maxRy = Math.max(24, (H - capH - padTop) / 2);
  if (L.ry > maxRy) {
    L.ry = maxRy;
    L.hh = Math.min(L.hh, L.ry * 0.72);
    L.hw = L.hh * 1.6;
    L.rx = Math.min(L.rx, Math.max(L.hw + 24, maxRx));
  }
  L.cy = Math.min(Math.max(padTop + L.ry, H * 0.42), H - capH - L.ry);
  document.getElementById('caption').style.top = (L.cy + L.ry + Math.min(H * 0.05, 46)) + 'px';
}
layout();

// ---------- blobs ----------
let uid = 0, phase = 0, simT = 0;
const blobs = [];          // all live blobs (render order irrelevant)
const items = [];          // slide order (no pull blobs)
let main = null, pull = null, lastOut = null;
const SAT_R = [0.032, 0.026, 0.036, 0.024, 0.03, 0.022, 0.034, 0.027, 0.029, 0.025, 0.031, 0.023];
function mkBlob(o) {
  const b = Object.assign({ id: uid++, photo:0, hue:0, role:'sat', theta:0, m:1, rs:0.03, z:0, dying:false, mapTo:null }, o);
  b.x = S(o.x0 ?? L.cx); b.y = S(o.y0 ?? L.cy); b.w = S(o.w0 ?? 10); b.h = S(o.h0 ?? 10); b.s = S(o.s0 ?? 1);
  b.hs = S(1); b.kf = S(1); b.hover = false;   // hover scale + per-drop goo factor
  blobs.push(b); return b;
}
function satTarget(b) {
  const a = b.theta + phase, br = 1 + 0.035 * Math.sin(simT * 0.6 + b.id * 1.7);
  return [L.cx + Math.cos(a) * L.rx * b.m * br, L.cy + Math.sin(a) * L.ry * b.m * br];
}
let hovered = null;
function setHover(b) {
  if (b && (b.role !== 'sat' || b.dying)) b = null;
  if (hovered === b) return;
  if (hovered) { hovered.hover = false; hovered.hs.t = 1; hovered.kf.t = 1; }
  hovered = b;
  if (b) { b.hover = true; b.hx = b.x.v; b.hy = b.y.v; b.hs.t = 1.5; b.kf.t = 0.3; }
}
function init() {
  const n = SLIDES.length;
  SLIDES.forEach((sl, i) => {
    const b = mkBlob({ photo: sl.photo, title: sl.title, sub: sl.sub, rs: SAT_R[i % SAT_R.length] });
    items.push(b);
    if (i === 0) { setMain(b, true); }
    else {
      b.theta = -Math.PI / 2 + (i - 1) * (Math.PI * 2 / (n - 1)) + 0.35; b.m = [1, 1.06, 0.97, 1.09, 1.02][i % 5];
      const [x, y] = satTarget(b); b.x = S(x); b.y = S(y); const r = b.rs * L.unit; b.w = S(r); b.h = S(r);
    }
  });
  renderCaption(true);
}
function setMain(b, instant) {
  b.role = 'main'; main = b;
  b.x.t = L.cx; b.y.t = L.cy; b.w.t = L.hw; b.h.t = L.hh;
  if (instant) { b.x = S(L.cx); b.y = S(L.cy); b.w = S(L.hw); b.h = S(L.hh); }
}
function swapTo(b) {
  if (!b || b === main || b.dying || b.role !== 'sat') return;
  if (hovered === b) setHover(null);
  const out = main; cropA.v = 0; cropA.vel = 0;
  const tIn = b.theta;
  // incoming: becomes main
  b.role = 'main'; main = b; b.z = 3; b.w.t = L.hw; b.h.t = L.hh; b.x.t = L.cx; b.y.t = L.cy;
  // a little anticipation: kick toward the centre
  b.x.vel += (L.cx - b.x.v) * 0.5; b.y.vel += (L.cy - b.y.v) * 0.5;
  // outgoing: pushed the opposite way, pinches off into the orbit
  out.role = 'sat'; out.z = 1.5; out.theta = tIn + Math.PI + (Math.random() - 0.5) * 0.3; out.m = b.m; out.rs = b.rs;
  const [tx, ty] = satTarget(out); out.x.vel += (tx - out.x.v) * 0.7; out.y.vel += (ty - out.y.v) * 0.7;
  if (lastOut && lastOut !== out) lastOut.z = 0; lastOut = out;
  blobs.forEach(o => { if (o !== b && o !== out) o.z = 0; });
  renderCaption();
}
function step(dir) {
  const live = items.filter(b => !b.dying); const i = live.indexOf(main);
  swapTo(live[(i + dir + live.length) % live.length]);
}
let extraI = 0;
function addAt(x, y) {
  const live = items.filter(b => !b.dying); if (live.length >= 12) return null;
  const dx = (x - L.cx) / L.rx, dy = (y - L.cy) / L.ry;
  const theta = Math.atan2(dy, dx) - phase, m = Math.min(1.18, Math.max(0.9, Math.hypot(dx, dy)));
  const ex = EXTRA[extraI++ % EXTRA.length];
  let ph = [4, 2, 0][(extraI - 1) % 3]; if (ph === main.photo) ph = (ph + 1) % 5;
  const b = mkBlob({ photo: ph, hue: [2.3, 3.4, 1.2][(extraI - 1) % 3], title: ex.title, sub: ex.sub, theta, m,
    rs: SAT_R[(live.length + 3) % SAT_R.length], x0: x, y0: y, s0: 0 });
  const r = b.rs * L.unit; b.w = S(r); b.h = S(r); b.s.t = 1; b.s.vel = 2; b.pop = true;
  items.push(b); renderCaption(); return b;
}
function removeBlob(b) {
  if (!b || b === main || b.role !== 'sat' || b.dying) return;
  if (hovered === b) setHover(null);
  b.dying = true; b.s.t = 0; b.s.vel = 3.2; b.popOut = true;
  renderCaption();
}

// ---------- pull (jelly drag) ----------
let drag = null;
function sdRB(px, py, b) {
  const s = Math.max(0, b.s.v) * b.hs.v, hw = b.w.v * s, hh = b.h.v * s, r = Math.min(hw, hh) * 0.96;
  const qx = Math.abs(px - b.x.v) - hw + r, qy = Math.abs(py - b.y.v) - hh + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
}
function pullStart(x, y) {
  pull = mkBlob({ role:'pull', photo: main.photo, hue: main.hue, mapTo: main, z: 2.6, x0: x, y0: y, s0: 0.4 });
  const r = main.h.v * 0.42; pull.w = S(r); pull.h = S(r); pull.s.t = 1;
  pullMove(x, y);
}
function pullMove(x, y) {
  if (!pull) return;
  const vx = x - main.x.v, vy = y - main.y.v, dist = Math.hypot(vx, vy) || 1, ux = vx / dist, uy = vy / dist;
  const beyond = sdRB(x, y, main), maxP = Math.min(150, main.h.v * 0.62);
  const rub = beyond > 0 ? maxP * (1 - Math.exp(-beyond / maxP)) : beyond * 0.5;
  const edge = dist - beyond, R = pull.w.v;
  const reach = edge + rub - R * 0.55;
  pull.x.t = main.x.v + ux * reach; pull.y.t = main.y.v + uy * reach;
  main.x.t = L.cx + ux * Math.max(0, rub) * 0.12; main.y.t = L.cy + uy * Math.max(0, rub) * 0.12;
  // squash the frame a touch toward the pull
  main.w.t = L.hw * (1 + Math.abs(ux) * Math.max(0, rub) / 1400); main.h.t = L.hh * (1 + Math.abs(uy) * Math.max(0, rub) / 900);
  pull._u = [ux, uy];
}
function pullEnd() {
  if (!pull) return;
  const [ux, uy] = pull._u || [0, 0];
  pull.x.t = main.x.v; pull.y.t = main.y.v; pull.s.t = 0; pull.dying = true; pull.isPull = true;
  main.x.t = L.cx; main.y.t = L.cy; main.w.t = L.hw; main.h.t = L.hh;
  main.x.vel -= ux * 260; main.y.vel -= uy * 260;          // snap back past centre
  main.w.vel += Math.abs(ux) * 420 - Math.abs(uy) * 220;   // jelly wobble
  main.h.vel += Math.abs(uy) * 360 - Math.abs(ux) * 260;
  pull = null;
}

// ---------- input ----------
function hit(x, y) {
  let best = null, bd = 1e9;
  for (const b of blobs) { if (b.dying || b.role === 'pull') continue; const d = sdRB(x, y, b) - (b.role === 'sat' ? 8 : 0); if (d < 0 && d < bd) { bd = d; best = b; } }
  return best;
}
function viewPoint(e) {
  const vv = window.visualViewport;
  const ox = vv ? (vv.offsetLeft || 0) : 0, oy = vv ? (vv.offsetTop || 0) : 0;
  return [e.clientX - ox, e.clientY - oy];
}
function finePointer(e) {
  if (e && e.pointerType && e.pointerType !== 'mouse') return false;
  return matchMedia('(hover: hover) and (pointer: fine)').matches;
}
cv.addEventListener('pointerdown', e => {
  if (DEMO) return;
  const [x, y] = viewPoint(e);
  const b = hit(x, y);
  if (b === main) { drag = { x, y, on:false }; cv.setPointerCapture(e.pointerId); return; }
  if (b) { P.remove ? removeBlob(b) : swapTo(b); return; }
  addAt(x, y);
});
const cursorEl = document.getElementById('cursor');
function placeCursor(x, y, overSat) { cursorEl.style.transform = `translate(${x}px, ${y}px)`; cursorEl.classList.toggle('hide', !!overSat); }
function showCursor(e, on) { cursorEl.style.display = (on && finePointer(e)) ? 'block' : 'none'; }
cv.addEventListener('pointerenter', e => { if (!DEMO) showCursor(e, true); });
cv.addEventListener('pointerleave', e => { if (DEMO) return; showCursor(e, false); if (!drag) setHover(null); });
cv.addEventListener('pointermove', e => {
  if (DEMO) return;
  const [x, y] = viewPoint(e);
  showCursor(e, true);
  if (!drag) { const b = hit(x, y); const sat = b && b.role === 'sat' ? b : null; setHover(sat); placeCursor(x, y, sat); return; }
  placeCursor(x, y, false);
  if (!drag.on && Math.hypot(x - drag.x, y - drag.y) > 4) { drag.on = true; pullStart(x, y); }
  if (drag.on) pullMove(x, y);
});
const endDrag = () => { if (drag && drag.on) pullEnd(); drag = null; };

document.addEventListener('touchmove', e => { if (e.target === cv || e.target.closest?.('#gl, #caption, #crop')) e.preventDefault(); }, { passive:false });
let wheelLock = 0;
addEventListener('wheel', e => { if (DEMO) return; const now = performance.now(); if (now < wheelLock || Math.abs(e.deltaY) < 6) return; wheelLock = now + 750; step(e.deltaY > 0 ? 1 : -1); }, { passive:true });

// ---------- caption (spring-driven so it also runs in sim time) ----------

// ---------- GL ----------
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float; precision highp sampler2DArray;
uniform sampler2DArray uTex; uniform vec2 uRes; uniform float uDpr; uniform int uN;

function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }

const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, IMG_W, IMG_H, 5);
gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });

const KF = new Float32Array(MAXN), G = new Float32Array(MAXN * 4), SS = new Float32Array(MAXN * 4), M = new Float32Array(MAXN * 4);
function render() {
  gl.viewport(0, 0, cv.width, cv.height);
  let n = 0;
  for (const b of blobs) { if (n >= MAXN) break; const s = Math.max(0, b.s.v) * b.hs.v; const hw = b.w.v * s, hh = b.h.v * s; if (hw < .3) continue;
    KF[n] = Math.max(0.05, b.kf.v);
    const mp = b.mapTo && !b.mapTo.dying ? b.mapTo : b; const ms = Math.max(0.05, mp.s.v);
    G.set([b.x.v, b.y.v, hw, hh], n * 4); SS.set([Math.min(hw, hh) * .96, b.photo, b.z, b.hue], n * 4);
    M.set([mp.x.v, mp.y.v, Math.max(4, mp.w.v * ms), Math.max(4, mp.h.v * ms)], n * 4); n++; }
  gl.uniform2f(uRes, W, H); gl.uniform1f(uDpr, dpr); gl.uniform1i(uN, n);

}

// ---------- simulation ----------
const crop = document.getElementById('crop'); const cropA = S(1);
function sim(dt) {
  simT += dt; simCaption(dt); const dPh = P.orbit * (Math.PI * 2 / 38) * dt; phase += dPh;
  // keep satellites spaced around the orbit
  const sats = blobs.filter(b => b.role === 'sat' && !b.dying);
  for (let i = 0; i < sats.length; i++) for (let j = 0; j < sats.length; j++) { if (i === j) continue;
    let d = Math.atan2(Math.sin(sats[i].theta - sats[j].theta), Math.cos(sats[i].theta - sats[j].theta));
    const minSep = Math.PI * 2 / Math.max(sats.length, 3) * 0.72;
    if (Math.abs(d) < minSep && !sats[i].hover) sats[i].theta += Math.sign(d || 1) * (minSep - Math.abs(d)) * 0.9 * dt; }
  const z = zeta();
  for (const b of blobs) {
    if (b.role === 'sat') {
      if (b.hover) { b.theta -= dPh; b.x.t = b.hx; b.y.t = b.hy; }   // parked: holds its screen angle while hovered
      else { const [tx, ty] = satTarget(b); b.x.t = tx; b.y.t = ty; }
      const r = b.rs * L.unit; b.w.t = r; b.h.t = r; }
    const Kp = b.role === 'pull' || b.isPull ? 300 : 72;
    stepS(b.x, Kp, z, dt); stepS(b.y, Kp, z, dt);
    const gw = b.w.t >= b.w.v, gh = b.h.t >= b.h.v;      // growing: springy jelly; shrinking: soft, never inverts
    stepS(b.w, gw ? 84 : 46, gw ? z * 0.95 : Math.max(0.92, z), dt); stepS(b.h, gh ? 54 : 38, gh ? z * 0.95 : Math.max(0.92, z), dt);
    if (b.w.v < 2) { b.w.v = 2; b.w.vel = Math.max(0, b.w.vel); } if (b.h.v < 2) { b.h.v = 2; b.h.vel = Math.max(0, b.h.vel); }
    stepS(b.hs, 620, 0.5, dt); stepS(b.kf, 260, 1, dt);

  for (let i = blobs.length - 1; i >= 0; i--) { const b = blobs[i]; if (b.dying && b.s.t === 0 && b.s.v < 0.01 && b.s.vel <= 0.5) { blobs.splice(i, 1); const k = items.indexOf(b); if (k >= 0) items.splice(k, 1); renderCaption(); } }
  // crop guides fade in only while the frame is at rest
  const speed = Math.hypot(main.x.vel, main.y.vel) + Math.abs(main.w.vel) + Math.abs(main.h.vel);
  cropA.t = P.crop && speed < 40 && !pull && Math.abs(main.w.v - L.hw) < 6 ? 1 : 0; stepS(cropA, 140, 1, dt);
}
function drawDom() {
  const a = Math.max(0, Math.min(1, cropA.v));
  const cw = main.w.v * 2 * 0.46, ch = main.h.v * 2 * 0.48;

}
function tick(ms) {
  let rest = ms / 1000; while (rest > 1e-6) { const h = Math.min(1 / 240, rest); sim(h); rest -= h; }
  if (DEMO) demoTick();
  render(); drawDom(); slides.forEach(drawSlide);

// ---------- scripted demo (for recording) ----------
const cursor = document.getElementById('cursor');
const cur = { x: 0, y: 0 }; let seg = null; const queue = [];
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function demoScript() {
  const sat = k => () => { const live = items.filter(b => !b.dying && b !== main); return live[k % live.length]; };
  const nextSat = () => { const live = items.filter(b => !b.dying); return live[(live.indexOf(main) + 1) % live.length]; };
  const posOf = f => () => { const b = f(); return b ? [b.x.v, b.y.v] : [W / 2, H / 2]; };
  let chosen = null, added = null;
  let hov = null;
  return [
    { at: 0.0, move: [W * 0.62, H * 0.86], dur: 0.01 },
    // hover the next drop ~0.6s, then click it in
    { at: 0.4, move: posOf(nextSat), dur: 0.8 },
    { at: 1.85, act: () => { cursorDown(); swapTo(nextSat()); } },
    // a full hover-in / hover-out with no click
    { at: 2.7, move: posOf(() => (hov = hov || (() => { const nx = nextSat(); const live = items.filter(b => !b.dying && b !== main && b !== nx); return live[1 % live.length]; })())), dur: 0.7 },
    { at: 4.0, move: () => { const hx = hov.hx ?? hov.x.v, hy = hov.hy ?? hov.y.v; return [hx + (L.cx - hx) * 0.18, hy + 150 * Math.sign(L.cy - hy || 1)]; }, dur: 0.5 },
    // hover, then click the next one
    { at: 4.6, move: posOf(nextSat), dur: 0.7 },
    { at: 5.95, act: () => { cursorDown(); swapTo(nextSat()); } },
    // jelly drag on the frame edge
    { at: 6.9, move: () => [main.x.v + main.w.v - 30, main.y.v + 20], dur: 0.7 },
    { at: 7.65, act: () => { cursor.classList.add('down'); pullStart(cur.x, cur.y); } },
    { at: 7.7, move: () => [L.cx + L.hw + 150, L.cy + 40], dur: 0.8, drag: true },
    { at: 8.5, move: () => [L.cx + L.hw + 95, L.cy - 70], dur: 0.45, drag: true },
    { at: 9.0, act: () => { cursor.classList.remove('down'); pullEnd(); } },
    // add a drop in empty space, hover it, bring it in
    { at: 9.6, move: () => [L.cx - L.rx * 0.78, L.cy - L.ry * 0.95], dur: 0.7 },
    { at: 10.4, act: () => { cursorDown(); added = addAt(cur.x, cur.y); } },
    { at: 11.2, move: posOf(() => added), dur: 0.6 },
    { at: 12.4, act: () => { cursorDown(); swapTo(added); } },
    // remove mode
    { at: 13.3, act: () => { rmBtn.click(); } },
    { at: 13.3, move: posOf(() => (chosen = chosen || sat(2)())), dur: 0.7 },
    { at: 14.5, act: () => { cursorDown(); removeBlob(chosen); } },
    { at: 15.0, act: () => { rmBtn.click(); } },
    { at: 15.3, move: posOf(nextSat), dur: 0.7 },
    { at: 16.6, act: () => { cursorDown(); swapTo(nextSat()); } },
    { at: 17.5, move: [W * 0.62, H * 0.9], dur: 1.0 },

}
function cursorDown() { cursor.classList.add('down'); setTimeout(() => cursor.classList.remove('down'), 160); }
let script = null;
function demoTick() {
  if (!script) { script = demoScript(); cursor.style.display = 'block'; }
  while (script.length && script[0].at <= simT) { const s = script.shift();
    if (s.act) s.act(); if (s.move) seg = { from: [cur.x, cur.y], to: s.move, t0: simT, dur: s.dur, drag: s.drag }; }
  if (seg) { const k = Math.min(1, (simT - seg.t0) / seg.dur), e = ease(k), to = typeof seg.to === 'function' ? seg.to() : seg.to;
    cur.x = seg.from[0] + (to[0] - seg.from[0]) * e; cur.y = seg.from[1] + (to[1] - seg.from[1]) * e;
    if (seg.drag) pullMove(cur.x, cur.y); if (k >= 1 && !seg.drag && typeof seg.to !== 'function') seg = null; }
  const hb = pull || drag ? null : hit(cur.x, cur.y), hsat = hb && hb.role === 'sat' ? hb : null;
  setHover(hsat); placeCursor(cur.x, cur.y, hsat);
  if (!script.length && Q.has('demo') && !CAPTURE && simT > 19.5) { /* loop demo */ location.reload(); }
}

// ---------- boot ----------
Promise.all([1,2,3,4,5].map(i => loadImg(`photo${i}.jpg`))).then(imgs => {
  const c = document.createElement('canvas'); c.width = IMG_W; c.height = IMG_H; const x = c.getContext('2d');
  imgs.forEach((im, i) => { x.drawImage(im, 0, 0, IMG_W, IMG_H); gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, IMG_W, IMG_H, 1, gl.RGBA, gl.UNSIGNED_BYTE, c); });
  init();
  window.__ready = true;
  if (CAPTURE) { window.__advance = ms => tick(ms); tick(0); }
  else { let last = performance.now(); const loop = now => { tick(Math.min(50, now - last)); last = now; requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
});
window.__app = { swapTo, step, addAt, removeBlob, pullStart, pullMove, pullEnd, P, blobs, items };
})();
