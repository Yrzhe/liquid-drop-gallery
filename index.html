<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Liquid Drop Gallery</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='7.5' fill='%23f4f4f2'/%3E%3Ccircle cx='25' cy='8' r='3.2' fill='%23f4f4f2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#f4f4f2; --muted:#8a8a88; --dim:#6f6f6d; --panel:rgba(22,22,22,.72); --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; height:100dvh; background:var(--bg); overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; font-family:Inter, ui-sans-serif, system-ui, sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; -webkit-user-select:none; }
  #crop { position:fixed; left:0; top:0; pointer-events:none; border:1px solid rgba(255,255,255,.5); will-change:transform,opacity; opacity:0; }
  #crop i { position:absolute; width:5px; height:5px; border:1px solid rgba(255,255,255,.7); background:rgba(0,0,0,.2); transform:translate(-50%,-50%); }
  #crop b { position:absolute; left:50%; top:50%; width:66px; height:66px; transform:translate(-50%,-50%); }
  #crop b::before, #crop b::after { content:""; position:absolute; background:rgba(255,255,255,.5); }
  #crop b::before { left:0; right:0; top:50%; height:1px; }
  #crop b::after { top:0; bottom:0; left:50%; width:1px; }
  #caption { position:fixed; left:0; right:0; top:0; pointer-events:none; text-align:center; }
  #pg { position:absolute; left:0; right:0; font-family:"Geist Mono", ui-monospace, monospace; font-size:12px; line-height:12px; letter-spacing:.02em; color:#7a7a78; white-space:pre; }
  #pg em { font-style:normal; color:#e9e9e7; }
  .slide { position:absolute; left:0; right:0; top:0; }
  .title { position:absolute; left:0; right:0; font-size:37.6px; line-height:37.6px; font-weight:400; letter-spacing:-.005em; white-space:nowrap; color:#f6f6f4; }
  .title span { display:inline-block; will-change:opacity,filter; white-space:pre; }
  .sub { position:absolute; left:0; right:0; font-size:14.7px; line-height:15px; font-weight:400; color:rgba(244,244,242,.56); white-space:nowrap; will-change:opacity,filter; }
  #edit { position:fixed; right:0; top:52.7%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:#1b1b1b; border:1px solid var(--line); color:#bdbdbb; display:grid; place-items:center; cursor:pointer; }
  #edit:hover { color:#fff; background:#242424; }
  #panel { position:fixed; right:44px; top:50%; width:236px; transform:translateY(-50%) translateX(12px); opacity:0; pointer-events:none;
           background:var(--panel); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
           transition: opacity .25s ease, transform .35s cubic-bezier(.2,1.2,.3,1); font-size:12px; color:#cfcfcd; }
  #panel.open { opacity:1; pointer-events:auto; transform:translateY(-50%); }
  #panel h4 { font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; font-family:"Geist Mono", ui-monospace, monospace; }
  .row { margin-bottom:12px; }
  .row label { display:flex; justify-content:space-between; margin-bottom:6px; }
  .row label span:last-child { font-family:"Geist Mono", ui-monospace, monospace; color:var(--muted); font-size:11px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:2px; background:#3a3a3a; border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#f2f2f0; cursor:pointer; box-shadow:0 0 0 3px rgba(255,255,255,.08); }
  .btns { display:flex; gap:6px; margin-top:4px; }
  .btn { flex:1; height:28px; border-radius:8px; border:1px solid var(--line); background:#1d1d1d; color:#e6e6e4; font:inherit; font-size:12px; cursor:pointer; }
  .btn:hover { background:#262626; }
  .btn.on { background:#f2f2f0; color:#111; }
  .tog { display:flex; align-items:center; justify-content:space-between; margin:2px 0 12px; }
  .tog input { accent-color:#f2f2f0; }
  .hint { margin-top:10px; color:var(--dim); font-size:11px; line-height:1.5; }
  /* scripted-demo pointer (the live page uses the native cursor, as in the original) */
  #cursor { position:fixed; left:0; top:0; pointer-events:none; display:none; z-index:10; width:0; height:0; }
  #cursor svg { position:absolute; left:0; top:0; display:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  #cursor.arrow .a, #cursor.hand .h { display:block; }
  #cursor .h { left:-6px; top:-1px; }
  #fallback { position:fixed; inset:0; display:grid; place-items:center; padding:32px; text-align:center; color:#cfcfcd; font-size:15px; line-height:1.6; }
  @media (max-width:700px), (pointer:coarse) {
    #edit { top:auto; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); right:calc(16px + env(safe-area-inset-right, 0px)); transform:none; z-index:5; }
    #panel { top:auto; bottom:calc(56px + env(safe-area-inset-bottom, 0px)); right:16px; left:16px; width:auto; max-width:360px; margin-left:auto; transform:translateY(12px); }
    #panel.open { transform:none; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="crop"><i style="left:0;top:0"></i><i style="left:2.4%;top:0"></i><i style="left:28%;top:0"></i><i style="left:50%;top:0"></i><i style="left:72%;top:0"></i><i style="left:97.6%;top:0"></i><i style="left:100%;top:0"></i>
<i style="left:0;top:100%"></i><i style="left:2.4%;top:100%"></i><i style="left:28%;top:100%"></i><i style="left:50%;top:100%"></i><i style="left:72%;top:100%"></i><i style="left:97.6%;top:100%"></i><i style="left:100%;top:100%"></i>
<i style="left:0;top:50%"></i><i style="left:2.4%;top:50%"></i><i style="left:28%;top:50%"></i><i style="left:72%;top:50%"></i><i style="left:97.6%;top:50%"></i><i style="left:100%;top:50%"></i><b></b></div>
<div id="caption"><div id="pg"></div></div>
<button id="edit" title="Properties"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
<div id="panel">
  <h4>Properties</h4>
  <div class="row"><label><span>Goo</span><span id="vGoo"></span></label><input id="goo" type="range" min="0" max="200" step="1" value="110"></div>
  <div class="row"><label><span>Bounce</span><span id="vBounce"></span></label><input id="bounce" type="range" min="0" max="1" step="0.01" value="0.08"></div>
  <div class="row"><label><span>Drift</span><span id="vOrbit"></span></label><input id="orbit" type="range" min="0" max="4" step="0.05" value="1"></div>

</div>
<div id="cursor" class="arrow"><svg class="a" width="13" height="19" viewBox="0 0 13 19"><path d="M1 1 L1 15.5 L4.6 12.2 L7 17.6 L9.3 16.6 L7 11.4 L11.8 11.4 Z" fill="#111" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg><svg class="h" width="16" height="18" viewBox="0 0 16 18"><path d="M5.2 1.2c.8 0 1.4.6 1.4 1.4v5.2l.1-.9c.1-.7.7-1.2 1.4-1.1.7.1 1.1.7 1.1 1.4v.6c.2-.6.8-1 1.4-.9.7.1 1.1.8 1.1 1.4v.8c.2-.5.7-.8 1.3-.7.7.1 1.1.7 1.1 1.4v3.6c0 2.6-2 4.7-4.6 4.7H8.4c-1.4 0-2.7-.7-3.5-1.8L1.4 10.4c-.4-.6-.3-1.4.3-1.8.6-.4 1.3-.3 1.8.2l.3.4V2.6c0-.8.6-1.4 1.4-1.4z" fill="#fff" stroke="#111" stroke-width="1"/></svg></div>
<script>
(() => {
const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture'), DEMO = Q.has('demo') || CAPTURE;
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias:false, premultipliedAlpha:false, preserveDrawingBuffer: CAPTURE });
if (!gl) {
  const el = document.createElement('div'); el.id = 'fallback';
  el.textContent = 'This gallery needs WebGL2. Try a current version of Safari, Chrome, or Firefox.';
  document.body.appendChild(el);
  return;
}
const MAXN = 16, NPH = 6, IMG_W = 1024, IMG_H = 636, IA = IMG_W / IMG_H;

// ---------- data (same order as the original: 01..06) ----------
const SLIDES = [
  { photo:0, title:'Where the light begins', sub:'Scroll \u2014 the next drop flows into the frame.' },
  { photo:5, title:'Quiet profile, warm edge', sub:'Hover a drop \u2014 it leans in before it joins.' },
  { photo:3, title:'Soft layers, sharp focus', sub:'Tune goo, bounce and orbit from the properties panel.' },
  { photo:1, title:'Made for stories', sub:'Images or videos \u2014 up to 12 items.' },
  { photo:2, title:'End on a strong frame', sub:'The section releases the scroll after the last drop.' },
  { photo:4, title:'One more drop', sub:'Add, remove and reorder items freely.' },
];
const ITEM_R = [.12, .17, .165, .175, .18, .133];   // per-item drop radius (x frame half-height), measured on the source
const EXTRA = [
  { title:'Born from the orbit', sub:'A new drop condenses out of the dark.' },
  { title:'Still water, bright edge', sub:'Every merge ends in a little wobble.' },
  { title:'Hold the frame', sub:'Drag its edge \u2014 it pulls like jelly.' },
];

// ---------- params ----------
const P = { goo:110, bounce:0.08, orbit:1, refr:1, crop:true, remove:false };
const bindRange = (id, key, fmt) => { const el = document.getElementById(id), v = document.getElementById('v' + id[0].toUpperCase() + id.slice(1));
  const set = () => { P[key] = parseFloat(el.value); v.textContent = fmt(P[key]); }; el.addEventListener('input', set); set(); };
bindRange('goo', 'goo', x => x.toFixed(0) + 'px');
bindRange('bounce', 'bounce', x => x.toFixed(2));
bindRange('orbit', 'orbit', x => x.toFixed(2) + '\u00d7');
bindRange('refr', 'refr', x => x.toFixed(2));
const cropBox = document.getElementById('cropOn');
cropBox.addEventListener('change', e => P.crop = e.target.checked);
const panel = document.getElementById('panel');
document.getElementById('edit').onclick = () => panel.classList.toggle('open');
const rmBtn = document.getElementById('rm');
rmBtn.onclick = () => { P.remove = !P.remove; rmBtn.classList.toggle('on', P.remove); };

// ---------- springs ----------
const S = v => ({ v, vel:0, t:v });
const zeta = () => Math.max(0.2, 1 - 0.8 * P.bounce);      // default ~critically damped, as in the original
function stepS(s, K, z, dt) { const c = 2 * z * Math.sqrt(K); const a = -K * (s.v - s.t) - c * s.vel; s.vel += a * dt; s.v += s.vel * dt; }
const K_MOVE = 64;   // omega 8/s: a swap reads ~0.45 s and settles by ~0.65 s (measured on the source)

// ---------- layout (measured on the source: frame 53.7% x 50.1% of the viewport, centre at 46% height) ----------
let W = innerWidth, H = innerHeight, dpr = 1, renderScale = 1;
const L = {};
function viewSize() {
  const vv = window.visualViewport;
  if (vv && vv.width && vv.height) return [vv.width, vv.height, vv.offsetLeft || 0, vv.offsetTop || 0];
  return [innerWidth, innerHeight, 0, 0];
}
const pgEl = document.getElementById('pg'), cap = document.getElementById('caption');
function layout() {
  const [vw, vh, ox, oy] = viewSize();
  W = vw; H = vh; dpr = Math.min(devicePixelRatio || 1, CAPTURE ? 1 : 2) * renderScale;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.style.left = ox + 'px'; cv.style.top = oy + 'px';
  const portrait = W < H * 0.9;
  L.cx = W / 2;
  if (!portrait) {
    L.hw = Math.min(W * 0.2685, H * 0.2507 * 1.6); L.hh = L.hw / 1.6; L.cy = H * 0.46;
    L.sx = L.hw; L.sy = L.hh;
    L.capY = Math.max(L.cy + L.hh * 1.45, H * 0.812);
  } else {
    L.hw = W * 0.36; L.hh = L.hw / 1.6; L.cy = H * 0.42;
    L.sx = Math.min(L.hw, (W / 2 - 34) / 1.32); L.sy = L.hh * 1.25;
    L.capY = L.cy + L.hh * 2.35;
  }
  L.u = L.hh;                                   // satellite radii are in frame half-heights
  const ts = portrait ? Math.min(1, W / 520) : Math.min(1.25, Math.max(0.6, W / 1503));
  pgEl.style.top = (L.capY + 3 * ts) + 'px';
  L.titleY = L.capY + 28.5 * ts; L.subY = L.capY + 80 * ts; L.ts = ts;
  pgEl.style.fontSize = (12 * Math.max(ts, .85)) + 'px';
}
layout();

// ---------- ring of slots, measured from the source (polar, in frame half-width / half-height units) ----------
// order after the main frame going forward: bottom-left, left, top, top-right, bottom-right
const SLOTS = [ { a:122.3, d:1.642, r:1 }, { a:206.2, d:1.404, r:1 }, { a:266.5, d:1.322, r:1 }, { a:329.6, d:1.483, r:1.15 }, { a:413.9, d:1.697, r:1 } ];
function slotAt(u) { const f = Math.max(0, Math.min(4, u * 4)), i = Math.min(3, Math.floor(f)), t = f - i, A = SLOTS[i], B = SLOTS[i + 1];
  return { a: (A.a + (B.a - A.a) * t) * Math.PI / 180, d: A.d + (B.d - A.d) * t, r: A.r + (B.r - A.r) * t }; }

// ---------- blobs ----------
let uid = 0, simT = 0;
const blobs = [];          // all live blobs
const items = [];          // ring order
let main = null;
const KF_REST = 0.5;
function mkBlob(o) {
  const b = Object.assign({ id: uid++, photo:0, hue:0, role:'sat', z:0, dying:false, anc:null, ph: 0, rs: .16 }, o);
  b.x = S(o.x0 ?? L.cx); b.y = S(o.y0 ?? L.cy); b.w = S(o.w0 ?? 10); b.h = S(o.h0 ?? 10); b.s = S(o.s0 ?? 1);
  b.hs = S(1); b.kf = S(KF_REST); b.hover = false; b.hot = 0;
  blobs.push(b); return b;
}
function live() { return items.filter(b => !b.dying); }
function ringOffset(b) { const lv = live(), n = lv.length; return (lv.indexOf(b) - lv.indexOf(main) + n) % n; }
function satTarget(b) {
  const lv = live(), n = lv.length, k = ringOffset(b);
  const sl = slotAt(n <= 2 ? 0.5 : (k - 1) / (n - 2));
  const dr = 0.05 * P.orbit;     // the source's drops barely drift; they do not orbit
  const nx = Math.cos(sl.a) * sl.d + dr * Math.sin(simT * 0.45 + b.ph), ny = Math.sin(sl.a) * sl.d + dr * 1.4 * Math.cos(simT * 0.37 + b.ph * 1.3);
  const r = sl.r * b.rs * L.u;
  let x = L.cx + nx * L.sx, y = L.cy + ny * L.sy;
  x = Math.max(r + 6, Math.min(W - r - 6, x)); y = Math.max(r + 6, Math.min(H - r - 6, y));
  return [x, y, r];
}
let hovered = null;
function setHover(b) {
  if (b && (b.role !== 'sat' || b.dying)) b = null;
  if (hovered === b) return;
  if (hovered) { hovered.hover = false; hovered.hs.t = 1; }
  hovered = b;
  if (b) { b.hover = true; b.hs.t = 1.3; }
}
function init() {
  SLIDES.forEach((sl, i) => { const b = mkBlob({ photo: sl.photo, title: sl.title, sub: sl.sub, rs: ITEM_R[i], ph: [0, 2.1, 4.4, 2.9, 0.7, 5.3][i] }); items.push(b); });
  main = items[0]; main.role = 'main'; main.x = S(L.cx); main.y = S(L.cy); main.w = S(L.hw); main.h = S(L.hh);
  items.slice(1).forEach(b => { const [x, y, r] = satTarget(b); b.x = S(x); b.y = S(y); b.w = S(r); b.h = S(r); });
  renderCaption(true);
}
// anchored motion: a blob grows / shrinks about one of its corners, so the incoming photo slides in
// sideways from its drop while the outgoing one is pushed out the other side (as in the source)
function bakeHover(b) { if (b.hs.v !== 1) { b.w.v *= b.hs.v; b.h.v *= b.hs.v; b.w.vel *= b.hs.v; b.h.vel *= b.hs.v; } b.hs = S(1); }
function setAnchor(b, sx, sy) {
  const w = b.w.v, h = b.h.v; b.anc = { x: S(b.x.v + sx * w), y: S(b.y.v + sy * h), sx, sy, t: 0 };
  b.anc.x.vel = b.x.vel; b.anc.y.vel = b.y.vel;
}
let stepQ = [];
function step(dir) {
  const lv = live(), n = lv.length; if (n < 2) return;
  const inc = lv[(lv.indexOf(main) + dir + n) % n], out = main;
  if (hovered === inc) setHover(null);
  bakeHover(inc);
  const sx = dir > 0 ? -1 : 1;
  inc.role = 'main'; main = inc; inc.z = 3; inc.hot = 1.0; inc.x.t = L.cx; inc.y.t = L.cy;
  setAnchor(inc, sx, inc.y.v < L.cy - L.hh * 0.2 ? -1 : 1);
  out.role = 'sat'; out.z = 1.5; out.hot = 1.0; setAnchor(out, -sx, 1);
  blobs.forEach(o => { if (o !== inc && o !== out) o.z = Math.max(0, o.z - 1.5); });
  if (P.crop) { P.crop = false; cropBox.checked = false; }     // the guides are an intro hint only, as in the source
  cropA.v = 0; cropA.vel = 0;
  renderCaption();
}
function queueSteps(dir, count, gap = 0.17) { let t = simT; for (let i = 0; i < count; i++) { stepQ.push({ dir, at: t }); t += Array.isArray(gap) ? (gap[i] ?? 0.17) : gap; } }
function swapTo(b) {
  if (!b || b === main || b.dying || b.role !== 'sat' || stepQ.length) return;
  const n = live().length, k = ringOffset(b);
  let dir = k <= n - k ? 1 : -1; if (k === n - k) dir = b.x.v < L.cx ? 1 : -1;
  queueSteps(dir, dir > 0 ? k : n - k, [0.12, 0.2]);
}
let extraI = 0;
function addAt(x, y) {
  const lv = live(); if (lv.length >= 12) return null;
  // insert at the ring position whose slot is nearest to the click
  let best = 1, bd = 1e9;
  for (let k = 1; k <= lv.length; k++) { const sl = slotAt(lv.length <= 1 ? .5 : (k - 1) / (lv.length - 1));
    const sx = L.cx + Math.cos(sl.a) * sl.d * L.sx, sy = L.cy + Math.sin(sl.a) * sl.d * L.sy, d = Math.hypot(sx - x, sy - y); if (d < bd) { bd = d; best = k; } }
  const ex = EXTRA[extraI++ % EXTRA.length];
  let ph = [4, 2, 0][(extraI - 1) % 3]; if (ph === main.photo) ph = (ph + 1) % NPH;
  const b = mkBlob({ photo: ph, hue: [2.3, 3.4, 1.2][(extraI - 1) % 3], title: ex.title, sub: ex.sub, rs: .16, ph: extraI * 1.7, x0: x, y0: y, s0: 0 });
  const r = 0.16 * L.u; b.w = S(r); b.h = S(r); b.s.t = 1; b.s.vel = 2;
  const after = lv[(lv.indexOf(main) + best - 1) % lv.length]; items.splice(items.indexOf(after) + 1, 0, b);
  renderCaption(); return b;
}
function removeBlob(b) {
  if (!b || b === main || b.role !== 'sat' || b.dying) return;
  if (hovered === b) setHover(null);
  b.dying = true; b.s.t = 0; b.s.vel = 3.2;
  renderCaption();
}

// ---------- shape helpers ----------
// rounded box, corner radius 0.93 x half-height at the frame's 1.6:1 (measured), a circle when square
function cornerR(hw, hh) { const m = Math.min(hw, hh), q = Math.max(hw, hh) / Math.max(m, 1e-3); return m * (1 - 0.07 * Math.min(1, (q - 1) / 0.6)); }
function sdRB(px, py, b) {
  const s = Math.max(0, b.s.v) * b.hs.v, hw = b.w.v * s, hh = b.h.v * s, r = cornerR(hw, hh);
  const qx = Math.abs(px - b.x.v) - (hw - r), qy = Math.abs(py - b.y.v) - (hh - r);
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
}

// ---------- pull: the frame edge stretches into a tapered tentacle toward the pointer ----------
const pull = { on:false, act:false, bx:0, by:0, tx:S(0), ty:S(0), r0:0, r1:0, lastX:0, lastY:0 };
function boundaryToward(ux, uy) {   // distance from the main centre to its outline along a ray
  let lo = 0, hi = Math.max(L.hw, L.hh) * 2;

// ---------- simulation ----------
const crop = document.getElementById('crop'); const cropA = S(0.9);
function sim(dt) {
  simT += dt; simCaption(dt);
  while (stepQ.length && stepQ[0].at <= simT) step(stepQ.shift().dir);
  const z = zeta();
  for (const b of blobs) {
    let tx, ty, tr;
    if (b.role === 'main') { tx = main.x.t; ty = main.y.t; b.w.t = L.hw; b.h.t = L.hh; }
    else { [tx, ty, tr] = satTarget(b); b.w.t = tr; b.h.t = tr; b.x.t = tx; b.y.t = ty; }
    stepS(b.w, K_MOVE, z, dt); stepS(b.h, K_MOVE, z, dt);
    if (b.w.v < 2) { b.w.v = 2; b.w.vel = Math.max(0, b.w.vel); } if (b.h.v < 2) { b.h.v = 2; b.h.vel = Math.max(0, b.h.vel); }
    if (b.anc) {
      const a = b.anc; a.t += dt;
      const ww = b.role === 'main' ? L.hw : b.w.t, hh = b.role === 'main' ? L.hh : b.h.t;
      a.x.t = (b.role === 'main' ? L.cx : tx) + a.sx * ww; a.y.t = (b.role === 'main' ? L.cy : ty) + a.sy * hh;
      stepS(a.x, K_MOVE, z, dt); stepS(a.y, K_MOVE, z, dt);
      const nx = a.x.v - a.sx * b.w.v, ny = a.y.v - a.sy * b.h.v;
      b.x.vel = (nx - b.x.v) / dt; b.y.vel = (ny - b.y.v) / dt; b.x.v = nx; b.y.v = ny;
      if (a.t > 1.4) { b.anc = null; b.x.t = tx; b.y.t = ty; b.x.vel = 0; b.y.vel = 0; }
    } else {
      const Kp = b.role === 'main' ? 160 : K_MOVE;
      stepS(b.x, Kp, z, dt); stepS(b.y, Kp, z, dt);
    }
    if (b.hot > 0) b.hot -= dt;
    b.kf.t = b.hot > 0 || (b.role === 'main' && pull.on) ? 1 : (b.hover ? 0.32 : KF_REST);
    stepS(b.hs, 420, 0.75, dt); stepS(b.kf, b.kf.t > b.kf.v ? 400 : 30, 1, dt);

  if (pull.on) { stepS(pull.tx, pull.act ? 700 : 160, pull.act ? 0.9 : 0.85, dt); stepS(pull.ty, pull.act ? 700 : 160, pull.act ? 0.9 : 0.85, dt);
    if (pull.act) pullAim(pull.lastX, pull.lastY);

}
function drawDom() {
